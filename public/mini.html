<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Focus</title>
<style>
  :root {
    --line: rgba(255,255,255,0.13);
    --text: #eef0f7;
    --muted: #a6adbf;
    --accent: #7c9bff;
    --green: #3fb27f;
  }
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; color: var(--text); }
  /* The whole card is the drag handle; controls opt out below. */
  .card { height: 100%; display: flex; flex-direction: column; padding: 13px 15px 12px;
    background: linear-gradient(160deg, rgba(23,26,35,.94), rgba(14,16,22,.96));
    border: 1px solid var(--line); border-radius: 15px;
    box-shadow: 0 14px 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.13);
    backdrop-filter: saturate(150%) blur(18px); -webkit-backdrop-filter: saturate(150%) blur(18px);
    -webkit-app-region: drag; }
  .top { display: flex; align-items: center; gap: 7px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0;
    box-shadow: 0 0 0 0 rgba(63,178,127,.55); animation: pulse 2s infinite; }
  .dot.paused { background: #f5a623; animation: none; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(63,178,127,.5)} 70%{box-shadow:0 0 0 7px rgba(63,178,127,0)} 100%{box-shadow:0 0 0 0 rgba(63,178,127,0)} }
  .label { font-size: 9.5px; font-weight: 750; letter-spacing: .9px; text-transform: uppercase; color: var(--muted); }
  /* Sits in the drag region, so it opts out of dragging itself. */
  .x { -webkit-app-region: no-drag; margin-left: auto; width: 20px; height: 20px; min-width: 20px;
    padding: 0; font-size: 10px; line-height: 1; background: none; border: none; color: var(--muted);
    border-radius: 6px; opacity: .55; }
  .x:hover { opacity: 1; color: #ff8f8f; background: rgba(255,107,129,.14); }
  .x:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; opacity: 1; }
  .timer { font-size: 34px; font-weight: 250; letter-spacing: -1.4px; font-variant-numeric: tabular-nums;
    text-align: center; margin: 5px 0 2px; line-height: 1.08; }
  .task { font-size: 11.5px; color: var(--muted); text-align: center; margin-bottom: 8px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted);
    padding: 6px 8px; border-radius: 8px; background: rgba(255,255,255,.05); margin-bottom: 9px; min-height: 27px; }
  .track.hidden { display: none; }
  .track-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Says something is playing. It is not analysing audio — Spotify plays in
     its own app and nothing reaches this window. */
  .eq { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 9px; flex-shrink: 0; }
  .eq i { width: 2px; border-radius: 1px; background: #1ed760; height: 30%; }
  .eq.on i { animation: eqBar .9s ease-in-out infinite alternate; }
  .eq i:nth-child(1) { animation-duration: .74s; animation-delay: -.15s; }
  .eq i:nth-child(2) { animation-duration: 1.02s; animation-delay: -.42s; }
  .eq i:nth-child(3) { animation-duration: .62s; animation-delay: -.05s; }
  .eq.paused i { animation-play-state: paused; }
  @keyframes eqBar { from { height: 20%; } to { height: 100%; } }
  @media (prefers-reduced-motion: reduce) { .eq.on i { animation: none; height: 60%; } }
  .vol { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; -webkit-app-region: no-drag; }
  .vol.hidden { display: none; }
  .vol button { min-width: 26px; height: 24px; padding: 0; font-size: 11px; background: none; border: none; }
  .vol button:hover { background: rgba(255,255,255,.1); }
  /* The visible track stays thin while the control keeps a grabbable height. */
  .vol input { -webkit-appearance: none; appearance: none; flex: 1; height: 16px;
    background: transparent; cursor: pointer; -webkit-app-region: no-drag; }
  .vol input::-webkit-slider-runnable-track { height: 4px; border-radius: 99px; background: rgba(255,255,255,.22); }
  .vol input::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%;
    background: #1db954; margin-top: -3.5px; cursor: pointer; }
  .ctrls { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: auto; -webkit-app-region: no-drag; }
  button { -webkit-app-region: no-drag; background: rgba(255,255,255,.07); border: 1px solid var(--line);
    color: var(--text); font-family: inherit; font-size: 12px; border-radius: 8px; cursor: pointer;
    height: 30px; min-width: 34px; padding: 0 9px; transition: .13s; display: grid; place-items: center; }
  button:hover { background: rgba(255,255,255,.14); }
  button:active { transform: scale(.94); }
  .primary { background: var(--accent); border-color: transparent; color: #fff; min-width: 42px; }
  .primary:hover { filter: brightness(1.1); background: var(--accent); }
  .end { color: #ff8f8f; }
  .end:hover { background: rgba(255,107,129,.16); border-color: rgba(255,107,129,.4); }
  .sep { width: 1px; height: 17px; background: var(--line); margin: 0 2px; }
  .idle { flex: 1; display: grid; place-items: center; font-size: 11.5px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <span class="dot" id="dot"></span>
    <span class="label" id="label">Focusing</span>
    <button class="x" id="close" title="Close (⌘W) — the timer keeps running" aria-label="Close">✕</button>
  </div>
  <div class="timer" id="timer">00:00</div>
  <div class="task" id="task"></div>
  <div class="track hidden" id="track"><span class="eq" id="eq" aria-hidden="true"><i></i><i></i><i></i></span><span class="track-name" id="trackName"></span></div>
  <div class="vol hidden" id="volRow">
    <button id="mute" title="Mute / unmute">🔊</button>
    <input type="range" id="vol" min="0" max="100" value="70" aria-label="Volume" />
  </div>
  <div class="ctrls" id="ctrls">
    <button class="primary" id="toggle" title="Pause / Resume">⏸</button>
    <button class="end" id="end" title="End focus">■</button>
    <div class="sep"></div>
    <button id="prev" title="Previous track">⏮</button>
    <button id="play" title="Play / Pause music">▶</button>
    <button id="next" title="Next track">⏭</button>
  </div>
</div>
<script>
  const $ = (s) => document.querySelector(s);
  // The mini window holds NO session of its own — it renders the timestamps
  // the main window sends and derives elapsed time exactly the same way.
  let state = { active: false, accumulatedSec: 0, runningSince: null, label: '', track: '', playing: false, volume: null };
  // While the user is dragging, their value wins over incoming pushes.
  let volDragging = false;

  function elapsed() {
    return (state.accumulatedSec || 0) + (state.runningSince ? (Date.now() - state.runningSince) / 1000 : 0);
  }
  function fmt(sec) {
    sec = Math.max(0, Math.floor(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    const mm = String(m).padStart(2, '0'), ss = String(s).padStart(2, '0');
    return h ? h + ':' + mm + ':' + ss : mm + ':' + ss;
  }
  function paint() {
    $('#timer').textContent = fmt(elapsed());
    const running = !!state.runningSince;
    $('#dot').className = 'dot' + (running ? '' : ' paused');
    $('#label').textContent = running ? 'Focusing' : 'Paused';
    $('#toggle').textContent = running ? '⏸' : '▶';
    $('#toggle').title = running ? 'Pause focus' : 'Resume focus';
    $('#task').textContent = state.label || 'Free focus';
    const t = $('#track');
    if (state.track) {
      t.classList.remove('hidden');
      $('#trackName').textContent = state.track;
      const eq = $('#eq');
      eq.classList.add('on');
      eq.classList.toggle('paused', !state.playing);
    }
    else t.classList.add('hidden');
    $('#play').textContent = state.playing ? '⏸' : '▶';

    // Volume only makes sense when there is something playing to control.
    const hasVol = !!state.track && typeof state.volume === 'number';
    $('#volRow').classList.toggle('hidden', !hasVol);
    if (hasVol && !volDragging) {
      $('#vol').value = state.volume;
      $('#mute').textContent = state.volume === 0 ? '🔇' : state.volume < 45 ? '🔉' : '🔊';
    }
  }
  setInterval(paint, 1000);

  if (window.tn) {
    window.tn.onState((s) => { state = s || state; paint(); });
    window.tn.requestState();
    const send = (a) => window.tn.control(a);
    $('#toggle').onclick = () => send('toggle');
    $('#end').onclick    = () => send('end');
    $('#prev').onclick   = () => send('prev');
    $('#play').onclick   = () => send('playpause');
    $('#next').onclick   = () => send('next');

    // Dismissing is not ending: the session keeps running and this window just
    // goes away, reachable again from the app's pop-out control.
    const dismiss = () => { if (window.tn.dismissMini) window.tn.dismissMini(state && state.sessionKey); };
    $('#close').onclick = dismiss;
    addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { e.preventDefault(); dismiss(); }
      else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'w') { e.preventDefault(); dismiss(); }
    });

    // Volume is applied by the main window, like every other control here, so
    // there is still exactly one music player.
    let volTimer = null;
    const pushVol = (v) => {
      clearTimeout(volTimer);
      volTimer = setTimeout(() => window.tn.control('volume:' + v), 110);
    };
    // `volDragging` suppresses incoming pushes while the user is adjusting.
    // It also expires on its own: a pointerup outside the window or a
    // keyboard adjustment would otherwise leave the slider stuck, ignoring
    // every later update.
    let volRelease = null;
    const holdVol = () => {
      volDragging = true;
      clearTimeout(volRelease);
      volRelease = setTimeout(() => { volDragging = false; }, 700);
    };
    $('#vol').oninput = () => {
      holdVol();
      const v = +$('#vol').value;
      state.volume = v;
      $('#mute').textContent = v === 0 ? '🔇' : v < 45 ? '🔉' : '🔊';
      pushVol(v);
    };
    const releaseVol = () => { clearTimeout(volRelease); volDragging = false; };
    $('#vol').onchange = releaseVol;
    $('#vol').onpointerup = releaseVol;
    $('#vol').onblur = releaseVol;
    let lastVol = 70;
    $('#mute').onclick = () => {
      const cur = +$('#vol').value;
      const next = cur === 0 ? (lastVol || 70) : 0;
      if (cur !== 0) lastVol = cur;
      $('#vol').value = next; state.volume = next;
      $('#mute').textContent = next === 0 ? '🔇' : next < 45 ? '🔉' : '🔊';
      pushVol(next);
    };
  }
  paint();
</script>
</body>
</html>
